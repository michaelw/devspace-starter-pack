version: v2beta1

name: infra

require:
  commands:
    - name: yq
      versionArgs: ["--version"]
      versionRegEx: "yq \\(https://github.com/mikefarah/yq/\\) version (v\\d+\\.\\d+\\.\\d+)"
      version: ">= 4"

vars:
  ISTIO_CHART_VERSION: 1.26.2
  GATEWAY_EXT_AUTHZ_PROVIDER_NAME: gateway-ext-authz-grpc
  GATEWAY_EXT_AUTHZ_SERVICE_NAME: gateway-ext-authz
  GATEWAY_EXT_AUTHZ_SERVICE_NAMESPACE: istio-ingress
  GATEWAY_EXT_AUTHZ_SERVICE_PORT:
    default: 3001
  METALLB_CHART_VERSION: v0.15.2
  POSTGRES_VERSION: 16
  POSTGRES_CHART_VERSION: 16.7.20
  REDIS_CHART_VERSION: 21.2.12
  OTEL_COLLECTOR_CHART_VERSION: 0.153.0
  JAEGER_CHART_VERSION: 4.7.0
  # XXX pin all versions

  # XXX modify default bridge to carve out LB CIDR block, do not just alias it...
  DOCKER_CIDR_PREFIX:
    command: ./scripts/docker-cidr-prefix.sh
    default: "172.18.255"

deployments:
  trust-bundle:
    kubectl:
      inlineManifest: |
        apiVersion: trust.cert-manager.io/v1alpha1
        kind: Bundle
        metadata:
          name: cluster-trust-bundle
        spec:
          sources:
          - useDefaultCAs: true # XXX outdated ca-certificates?
          - secret:
              name: "cluster-root-ca-secret"
              key: "tls.crt"
          target:
            configMap:
              key: "trust-bundle.pem"
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${DEVSPACE_NAMESPACE}

profiles:
  - name: local-network
    description: Network, Gateways, Ingress
    activation:
      - vars:
          DEVSPACE_CONTEXT: "^(kind(?:-.+)?|docker-desktop|minikube|rancher-desktop|microk8s)$"
    merge:
      deployments:
        metallb:
          namespace: metallb-system
          helm:
            chart:
              name: metallb
              version: ${METALLB_CHART_VERSION}
              repo: https://metallb.github.io/metallb

        metallb-resources:
          namespace: metallb-system
          kubectl:
            inlineManifest: |-
              ---
              apiVersion: metallb.io/v1beta1
              kind: IPAddressPool
              metadata:
                name: host-pool
              spec:
                addresses:
                - ${DOCKER_CIDR_PREFIX}.192/26
              ---
              apiVersion: metallb.io/v1beta1
              kind: L2Advertisement
              metadata:
                name: host-pool
              spec:
                ipAddressPools:
                - host-pool

        istio-base:
          namespace: istio-system
          helm:
            chart:
              name: base
              version: ${ISTIO_CHART_VERSION}
              repo: https://istio-release.storage.googleapis.com/charts

        istiod:
          namespace: istio-system
          helm:
            chart:
              name: istiod
              version: ${ISTIO_CHART_VERSION}
              repo: https://istio-release.storage.googleapis.com/charts
            values:
              meshConfig:
                enablePrometheusMerge: true
                enableTracing: true
                defaultConfig:
                  proxyStatsMatcher:
                    inclusionRegexps:
                      - ".*ext_authz.*"
                      - "cluster\\.outbound\\|${GATEWAY_EXT_AUTHZ_SERVICE_PORT}\\|\\|${GATEWAY_EXT_AUTHZ_SERVICE_NAME}\\.${GATEWAY_EXT_AUTHZ_SERVICE_NAMESPACE}\\.svc\\.cluster\\.local;.*"
                extensionProviders:
                  - name: otel-tracing
                    opentelemetry:
                      service: otel-collector.observability.svc.cluster.local
                      port: 4317
                      resource_detectors:
                        environment: {}
                  - name: ${GATEWAY_EXT_AUTHZ_PROVIDER_NAME}
                    envoyExtAuthzGrpc:
                      service: ${GATEWAY_EXT_AUTHZ_SERVICE_NAME}.${GATEWAY_EXT_AUTHZ_SERVICE_NAMESPACE}.svc.cluster.local
                      port: 3001
                      timeout: 1s
                      includeRequestHeadersInCheck:
                        - authorization
                        - cookie
                        - x-request-id
                        - x-b3-traceid
                        - x-b3-spanid
                        - x-b3-parentspanid
                        - x-b3-sampled
                        - x-b3-flags
                        - b3
                        - traceparent
                        - tracestate
                      headersToUpstreamOnAllow:
                        - authorization
                      headersToDownstreamOnDeny:
                        - www-authenticate

        istio-ingress-gateway:
          namespace: istio-ingress
          helm:
            chart:
              name: gateway
              version: ${ISTIO_CHART_VERSION}
              repo: https://istio-release.storage.googleapis.com/charts
            values:
              service:
                type: LoadBalancer
              labels:
                istio: ingressgateway

        gateway-api-crds:
          namespace: istio-ingress
          kubectl:
            kustomize: true
            manifests:
              - https://github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.3.0

        cluster-gateway:
          namespace: istio-ingress
          kubectl:
            manifests:
              - ./manifests/gateway.yaml

        istio-gateway:
          namespace: istio-ingress
          kubectl:
            manifests:
              - ./manifests/istio-telemetry.yaml
              - ./manifests/istio-gateway-cert.yaml
              - ./manifests/istio-gateway.yaml

  - name: local-dns
    description: Local DNS integration for development
    activation:
      - vars:
          DEVSPACE_CONTEXT: "^(kind(?:-.+)?|docker-desktop|minikube|rancher-desktop|microk8s)$"
    merge:
      deployments:
        etcd:
          namespace: external-dns
          helm:
            chart:
              name: oci://registry-1.docker.io/bitnamicharts/etcd
              version: 12.0.18
            values:
              image:
                repository: bitnamilegacy/etcd
                tag: "3.6.4-debian-12-r3"
              persistence:
                enabled: true
              securityContext:
                runAsUser: 999

        coredns-external:
          namespace: external-dns
          helm:
            chart:
              name: coredns
              repo: https://coredns.github.io/helm
            values:
              service:
                loadBalancerIP: ${DOCKER_CIDR_PREFIX}.254

            valuesFiles:
              - ./helm-values/coredns-external.yaml

        external-dns:
          namespace: external-dns
          helm:
            chart:
              name: external-dns
              version: 1.21.1
              repo: https://kubernetes-sigs.github.io/external-dns/
            valuesFiles:
              - ./helm-values/external-dns.yaml

  - name: local-certs
    description: Certificate Management
    activation:
      - vars:
          DEVSPACE_CONTEXT: "^(kind(?:-.+)?|docker-desktop|minikube|rancher-desktop|microk8s)$"
    merge:
      deployments:
        cert-manager:
          namespace: cert-manager
          helm:
            chart:
              name: cert-manager
              repo: https://charts.jetstack.io
            values:
              installCRDs: true
              config:
                apiVersion: controller.config.cert-manager.io/v1alpha1
                kind: ControllerConfiguration
                enableGatewayAPI: true
              securityContext:
                runAsUser: 999
              cainjector:
                securityContext:
                  runAsUser: 999
              webhook:
                securityContext:
                  runAsUser: 999
              startupapicheck:
                securityContext:
                  runAsUser: 999

        trust-manager:
          namespace: cert-manager
          helm:
            chart:
              name: trust-manager
              repo: https://charts.jetstack.io

        reflector:
          namespace: reflector
          helm:
            chart:
              name: oci://ghcr.io/emberstack/helm-charts/reflector
            values:
              reflector:
                securityContext:
                  runAsUser: 999

        cert-chain:
          namespace: cert-manager
          helm:
            chart:
              name: cert-chain
              path: ./charts/cert-chain
            values:
              gatewayCert:
                enabled: false

  - name: local-aux
    description: Auxiliary services
    activation:
      - vars:
          DEVSPACE_CONTEXT: "^(kind(?:-.+)?|docker-desktop|minikube|rancher-desktop|microk8s)$"
    merge:
      deployments:
        reloader:
          namespace: reloader
          helm:
            chart:
              name: reloader
              repo: https://stakater.github.io/stakater-charts
            values:
              securityContext:
                runAsUser: 999

  - name: local-test
    description: Test applications
    merge:
      deployments:
        httpbin:
          namespace: httpbin
          kubectl:
            manifests:
              - ./manifests/httpbin-namespace.yaml
              - https://raw.githubusercontent.com/istio/istio/release-1.26/samples/httpbin/httpbin.yaml
              - ./manifests/httpbin-routes.yaml
              - ./manifests/httpbin-istio-vs.yaml
              - ./manifests/httpbin-service-mesh.yaml

  - name: with-o11y
    description: Cluster observability with Prometheus metrics and lightweight tracing
    activation:
      - vars:
          DEVSPACE_CONTEXT: "^(kind(?:-.+)?|docker-desktop|minikube|rancher-desktop|microk8s)$"
    merge:
      deployments:
        prometheus:
          namespace: observability
          helm:
            chart:
              name: kube-prometheus-stack
              repo: https://prometheus-community.github.io/helm-charts
            valuesFiles:
              - ./helm-values/prometheus.yaml
        metric-server:
          namespace: kube-system
          helm:
            chart:
              name: metrics-server
              repo: https://kubernetes-sigs.github.io/metrics-server
            values:
              args:
                - --kubelet-insecure-tls
        jaeger:
          namespace: observability
          helm:
            chart:
              name: jaeger
              version: ${JAEGER_CHART_VERSION}
              repo: https://jaegertracing.github.io/helm-charts
            valuesFiles:
              - ./helm-values/jaeger.yaml

        otel-collector:
          namespace: observability
          helm:
            chart:
              name: opentelemetry-collector
              version: ${OTEL_COLLECTOR_CHART_VERSION}
              repo: https://open-telemetry.github.io/opentelemetry-helm-charts
            valuesFiles:
              - ./helm-values/otel-collector.yaml

        jaeger-route:
          namespace: observability
          kubectl:
            manifests:
              - ./manifests/jaeger-route.yaml

        istio-metrics-monitors:
          namespace: observability
          kubectl:
            manifests:
              - ./manifests/istio-metrics-monitors.yaml

  - name: o11y-grafana
    description: Grafana UI for local observability
    merge:
      deployments:
        grafana:
          namespace: observability
          helm:
            chart:
              name: grafana
              repo: https://grafana.github.io/helm-charts
            valuesFiles:
              - ./helm-values/grafana.yaml

        grafana-route:
          namespace: observability
          kubectl:
            manifests:
              - ./manifests/grafana-route.yaml

        grafana-datasource-prometheus:
          namespace: observability
          kubectl:
            manifests:
              - ./manifests/grafana-datasource-prometheus.yaml

        grafana-dashboards-kubernetes:
          namespace: observability
          kubectl:
            manifests:
              - ./manifests/grafana-dashboards-kubernetes.yaml

  - name: o11y-addons
    description: Observability addons for logs and Grafana trace exploration
    merge:
      deployments:
        alloy:
          namespace: observability
          helm:
            chart:
              name: alloy
              version: 1.10.0
              repo: https://grafana.github.io/helm-charts
            valuesFiles:
              - ./helm-values/alloy.yaml

        loki:
          namespace: observability
          helm:
            chart:
              name: loki
              repo: https://grafana.github.io/helm-charts
            valuesFiles:
              - ./helm-values/loki.yaml

        tempo:
          namespace: observability
          helm:
            chart:
              name: tempo
              repo: https://grafana.github.io/helm-charts
            valuesFiles:
              - ./helm-values/tempo.yaml

        grafana-datasources-addons:
          namespace: observability
          kubectl:
            manifests:
              - ./manifests/grafana-datasources-addons.yaml

  - name: local-psql
    description: PostgreSQL for data storage
    merge:
      deployments:
        postgres:
          helm:
            chart:
              name: oci://registry-1.docker.io/bitnamicharts/postgresql
              version: ${POSTGRES_CHART_VERSION}
            valuesFiles:
              - ./helm-values/postgresql.yaml

  - name: local-redis
    description: Redis for data storage
    merge:
      deployments:
        redis:
          helm:
            chart:
              name: oci://registry-1.docker.io/bitnamicharts/redis
              version: ${REDIS_CHART_VERSION}
            valuesFiles:
              - ./helm-values/redis.yaml

  - name: local-es
    description: ElasticSearch
    merge:
      deployments:
        elasticsearch:
          namespace: elasticsearch
          helm:
            chart:
              name: elasticsearch
              repo: https://helm.elastic.co
            values:
              replicas: 1
              minimumMasterNodes: 1
              esJavaOpts: "-Xmx128m -Xms128m"
              protocol: http
              extraEnvs:
                - name: xpack.security.http.ssl.enabled
                  value: "false"
              secret:
                password: "elastic"

hooks:
  - name: docker-mac-net-connect-hook
    os: darwin
    command: |
      # check if docker-mac-net-connect is running, otherwise install and start it
      echo >&2 "I: Checking whether docker-mac-net-connect is installed..."
      if ! sudo brew services list | grep -q docker-mac-net-connect; then
        echo >&2 "I: Installing docker-mac-net-connect..."
        if ! brew install chipmk/tap/docker-mac-net-connect; then
          echo >&2 "E: Failed to install docker-mac-net-connect. Please check your Homebrew setup."
          exit 1
        fi
      else
        echo >&2 "I: docker-mac-net-connect is already installed."
      fi
      sudo brew services start chipmk/tap/docker-mac-net-connect
    events: ["after:deploy:metallb"]

  - name: metallb-node-label-hook
    command: kubectl label nodes --all node.kubernetes.io/exclude-from-external-load-balancers-
    silent: true
    events: ["before:deploy:metallb"]

  - name: update-cluster-dns-hook-darwin
    os: darwin
    command: devspace run update-cluster-dns
    events: ["after:deploy:cert-chain"]

  - name: update-cluster-dns-hook-linux
    os: linux
    command: devspace run update-cluster-dns-linux
    events: ["after:deploy:cert-chain"]

  - name: cert-chain-hook-darwin
    os: darwin
    command: |
      while ! devspace run import-root-ca; do
        echo >&2 "I: Waiting for root CA to be available..."
        sleep 5
      done
    events: ["after:deploy:cert-chain"]

  - name: cert-chain-hook-linux
    os: linux
    command: |
      while ! devspace run import-root-ca-linux; do
        echo >&2 "I: Waiting for root CA to be available..."
        sleep 5
      done
    events: ["after:deploy:cert-chain"]

  - name: wait-for-trust-manager-hook
    wait:
      running: true
    container:
      namespace: cert-manager
      containerName: trust-manager
      labelSelector:
        app.kubernetes.io/instance: trust-manager
    events: ["after:deploy:trust-manager"]

  - name: delete-etcd-pvc-hook
    command: |
      echo >&2 "I: Deleting etcd PVC..."
      kubectl -n external-dns delete pvc data-etcd-0 --ignore-not-found
    events: ["after:purge:etcd"]

pipelines:
  deploy:
    run: |-
      PHASES=(
        "etcd gateway-api-crds"
        "cert-manager metallb reflector prometheus"
        "cert-chain trust-manager"
        "istio-base"
        "istiod"
        "istio-ingress-gateway istio-metrics-monitors"
      )
      run_dependencies --all
      ensure_pull_secrets --all
      build_images --all

      enabled="$(get_config_value deployments | yq 'keys | join(" ")')"
      for phase in "${PHASES[@]}"; do
        final=()
        for d in $phase; do
          if is_in "$d" "$enabled"; then
            final+=("$d")
          fi
        done
        if [ ${#final[@]} -gt 0 ]; then
          create_deployments "${final[@]}"
        fi
      done
      create_deployments --all --except ${PHASES[@]}
      if is_in "grafana" "$enabled"; then
        # These dashboard ConfigMaps are too large for client-side apply's last-applied annotation.
        # DevSpace's kubectl deploy path adds --force, which kubectl rejects with --server-side.
        kubectl -n observability apply --server-side -f ./manifests/grafana-dashboards-candidates.yaml
        kubectl -n observability apply --server-side -f ./manifests/grafana-dashboards-istio.yaml
      fi

commands:
  docker-mac-net-connect:
    description: Connect Docker for Mac to the cluster
    section: network
    command: |
      # check if docker-mac-net-connect is running, otherwise install and start it
      echo >&2 "I: Checking whether docker-mac-net-connect is installed..."
      if ! sudo brew services list | grep -q docker-mac-net-connect; then
        echo >&2 "I: Installing docker-mac-net-connect..."
        if ! brew install chipmk/tap/docker-mac-net-connect; then
          echo >&2 "E: Failed to install docker-mac-net-connect. Please check your Homebrew setup."
          exit 1
        fi
      else
        echo >&2 "I: docker-mac-net-connect is already installed."
      fi
      sudo brew services start chipmk/tap/docker-mac-net-connect

  update-cluster-dns:
    description: Make external cluster DNS available on the host
    section: network
    command: |
      echo >&2 "I: Updating DNS settings..."
      sudo scutil <<EOF
      open
      d.init
      d.add ServerAddresses * ${DOCKER_CIDR_PREFIX}.254
      d.add SupplementalMatchDomains * kube
      set State:/Network/Service/kube/DNS
      quit
      EOF

  update-cluster-dns-linux:
    description: Make external cluster DNS available on a Linux host
    section: network
    command: |
      DNS_IP="${DOCKER_CIDR_PREFIX}.254"
      echo >&2 "I: Updating systemd-resolved DNS settings..."
      LINK="$(ip route get "${DNS_IP}" | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") {print $(i + 1); exit}}')"
      if [ -z "${LINK}" ]; then
        echo >&2 "E: Could not determine Linux route interface for ${DNS_IP}"
        exit 1
      fi
      sudo resolvectl dns "${LINK}" "${DNS_IP}"
      sudo resolvectl domain "${LINK}" "~kube"
      sudo resolvectl flush-caches

  reset-cluster-dns:
    description: Reset DNS service
    section: network
    command: |
      echo >&2 "I: Resetting DNS..."
      sudo scutil <<EOF
      open
      remove State:/Network/Service/kube/DNS
      quit
      EOF

  reset-cluster-dns-linux:
    description: Reset Linux systemd-resolved cluster DNS service
    section: network
    command: |
      DNS_IP="${DOCKER_CIDR_PREFIX}.254"
      echo >&2 "I: Resetting systemd-resolved DNS settings..."
      LINK="$(ip route get "${DNS_IP}" | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") {print $(i + 1); exit}}')"
      if [ -z "${LINK}" ]; then
        echo >&2 "E: Could not determine Linux route interface for ${DNS_IP}"
        exit 1
      fi
      sudo resolvectl revert "${LINK}"
      sudo resolvectl flush-caches

  import-root-ca:
    description: Import the root CA certificate of the cluster
    section: network
    command: |
      CERTFILE=$(mktemp -t cluster-root-ca.XXXXXX.crt)
      # Ensure cleanup on exit
      trap 'rm -f "${CERTFILE}"' EXIT

      echo >&2 "I: Extracting Root CA certificate..."
      kubectl get secret -n istio-ingress cluster-root-ca-secret -o jsonpath='{.data.tls\.crt}' | base64 -d > "${CERTFILE}"
      if [ ! -s "${CERTFILE}" ]; then
        echo >&2 "E: Failed to extract certificate or certificate is empty"
        exit 1
      fi
      openssl x509 -in "${CERTFILE}" -subject -issuer -dates -noout

      # Add to system keychain (requires admin password)
      echo >&2 "I: Adding certificate to macOS keychain..."
      sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "${CERTFILE}"

      echo >&2 "I: Root CA certificate imported successfully to system keychain."

  import-root-ca-linux:
    description: Import the root CA certificate of the cluster into the Linux trust store
    section: network
    command: |
      CERTFILE=$(mktemp -t cluster-root-ca.XXXXXX.crt)
      # Ensure cleanup on exit
      trap 'rm -f "${CERTFILE}"' EXIT

      echo >&2 "I: Extracting Root CA certificate..."
      kubectl get secret -n istio-ingress cluster-root-ca-secret -o jsonpath='{.data.tls\.crt}' | base64 -d > "${CERTFILE}"
      if [ ! -s "${CERTFILE}" ]; then
        echo >&2 "E: Failed to extract certificate or certificate is empty"
        exit 1
      fi
      openssl x509 -in "${CERTFILE}" -subject -issuer -dates -noout

      echo >&2 "I: Adding certificate to Linux trust store..."
      sudo install -m 0644 "${CERTFILE}" /usr/local/share/ca-certificates/devspace-starter-pack-cluster-root-ca.crt
      sudo update-ca-certificates

      echo >&2 "I: Root CA certificate imported successfully to Linux trust store."

  port-forward-otel:
    description: Forward the local OpenTelemetry Collector OTLP ports
    section: observability
    command: kubectl -n observability port-forward service/otel-collector 4317:4317 4318:4318
