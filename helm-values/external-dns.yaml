domainFilters:
  - kube
provider:
  name: coredns
policy: sync
sources:
  - service
  - istio-virtualservice
  - gateway-httproute
  - gateway-grpcroute
  # experimental
  # - gateway-tlsroute
  # - gateway-tcproute
  # - gateway-udproute
env:
  - name: ETCD_URLS
    value: http://etcd:2379
  - name: ETCD_USERNAME
    value: root
  - name: ETCD_PASSWORD
    valueFrom:
      secretKeyRef:
        name: etcd
        key: etcd-root-password
rbac:
  create: true
logLevel: debug
extraArgs:
  coredns-prefix: /skydns/
