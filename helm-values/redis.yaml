# Required when overriding Bitnami's image repository to bitnamilegacy.
global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/redis
  tag: "8.0.2-debian-12-r4"

auth:
  enabled: false  # For local dev only — disable in prod!

master:
  persistence:
    enabled: true
    size: 1Gi

replica:
  replicaCount: 0  # No replicas in dev
  persistence:
    enabled: true

service:
  type: ClusterIP
  port: 6379

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 100m
