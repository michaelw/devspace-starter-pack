adminUser: admin
adminPassword: admin

replicas: 1

grafana.ini:
  server:
    domain: grafana.int.kube
    root_url: https://grafana.int.kube/
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/home-dashboard/candidate-kubernetes-overview.json

extraConfigmapMounts:
  - name: home-dashboard
    mountPath: /var/lib/grafana/home-dashboard/candidate-kubernetes-overview.json
    subPath: candidate-kubernetes-overview.json
    configMap: grafana-dashboards-candidates
    readOnly: true
    optional: false

sidecar:
  dashboards:
    enabled: true
    env:
      HEALTH_PORT: "8083"
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      allowUiUpdates: false
  datasources:
    enabled: true
    env:
      HEALTH_PORT: "8081"
    label: grafana_datasource
    labelValue: "1"
    searchNamespace: ALL

service:
  type: ClusterIP
  port: 3000

persistence:
  enabled: true
  size: 2Gi

initChownData:
  enabled: false
