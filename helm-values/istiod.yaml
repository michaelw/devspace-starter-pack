meshConfig:
  enablePrometheusMerge: true
  enableTracing: true
  defaultConfig:
    proxyStatsMatcher:
      inclusionRegexps:
        - ".*ext_authz.*"
  extensionProviders:
    - name: otel-tracing
      opentelemetry:
        service: otel-collector.observability.svc.cluster.local
        port: 4317
        resource_detectors:
          environment: {}
