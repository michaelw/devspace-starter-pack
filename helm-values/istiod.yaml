meshConfig:
  enablePrometheusMerge: true
  enableTracing: true
  defaultConfig:
    proxyStatsMatcher:
      inclusionRegexps:
        - ".*ext_authz.*"
        - "cluster\\.outbound\\|3001\\|\\|gateway-ext-authz\\.istio-ingress\\.svc\\.cluster\\.local\\..*"
  extensionProviders:
    - name: otel-tracing
      opentelemetry:
        service: otel-collector.observability.svc.cluster.local
        port: 4317
        resource_detectors:
          environment: {}
    - name: gateway-ext-authz-grpc
      envoyExtAuthzGrpc:
        service: gateway-ext-authz.istio-ingress.svc.cluster.local
        port: 3001
        timeout: 1s
        includeRequestHeadersInCheck:
          - authorization
          - cookie
          - x-request-id
          - x-b3-traceid
          - x-b3-spanid
          - x-b3-parentspanid
          - x-b3-sampled
          - x-b3-flags
          - b3
          - traceparent
          - tracestate
        headersToUpstreamOnAllow:
          - authorization
        headersToDownstreamOnDeny:
          - www-authenticate
